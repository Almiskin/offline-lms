<!DOCTYPE html>

<head>

<meta name="theme-color" content="#2563eb" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />

</head>
<body>
  <div id="offline-banner" class="offline-banner hidden">

  </div>

    <div class="brand">📚 Offline LMS</div>
    <nav id="main-nav" class="main-nav hidden">
      <a href="#/dashboard">Courses</a>
      <a href="#/sync" id="sync-link">Sync <span id="pending-badge" class="badge hidden">0</span></a>
      <a href="#/reports">My Results</a>
      <span id="user-info"></span>

    </nav>
    <span id="connectivity-status" class="status-dot" title="Checking connection..."></span>
  </header>

  <main id="app"></main>

  <script src="/js/vendor/dexie.min.js"></script>
  <script src="/js/vendor/chart.umd.min.js"></script>

  <script src="/js/offline-manager.js"></script>
  <script src="/js/quiz.js"></script>
  <script src="/js/sync.js"></script>
